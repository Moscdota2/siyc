{% extends "base.html" %}
{% block content %}
<div class="sales-nav">
    <a href="{{ url_for('sales') }}">Consumo Directo</a>
    <a href="{{ url_for('view_tables') }}" class="{% if not is_bar_order %}active{% endif %}">Ordenes de Mesas</a>
    <a href="{{ url_for('bar_orders') }}">Ordenes de Barra (Usuarios)</a>
    <a href="{{ url_for('inventory_history') }}">Historico de Movimientos</a>
    <a href="{{ url_for('sales_reports') }}">Reportes de Venta</a>
    <a href="{{ url_for('manage_exchange_rate') }}">Tasa Bolivares</a>
</div>
<h2>Administrar Tasa de Cambio</h2>
<p>Tasa actual: 1 USD = {{ current_rate }} Bs</p>

<form method="POST">
    <div class="form-group">
        <label for="rate">Nueva tasa (Bs por USD)</label>
        <input type="number" step="0.01" class="form-control" id="rate" name="rate" required>
    </div>
    <button type="submit" class="btn btn-primary">Actualizar Tasa</button>
</form>
{% endblock %}
