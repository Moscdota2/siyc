{% extends "base.html" %}
{% block content %}
<h2>Administrar Tasa de Cambio</h2>
<p>Tasa actual: 1 USD = {{ current_rate }} Bs</p>

<form method="POST">
    <div class="form-group">
        <label for="rate">Nueva tasa (Bs por USD)</label>
        <input type="number" step="0.01" class="form-control" id="rate" name="rate" required>
    </div>
    <button type="submit" class="btn btn-primary">Actualizar Tasa</button>
</form>
{% endblock %}
