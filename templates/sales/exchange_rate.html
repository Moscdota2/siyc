{% extends "base.html" %}
{% block content %}
<div class="sales-nav">
    <a href="{{ url_for('sales.sales') }}" class="{{ 'active' if request.endpoint == 'sales.sales' }}">Consumo
        Directo</a>
    <a href="{{ url_for('sales.view_tables') }}"
        class="{{ 'active' if request.endpoint == 'sales.view_tables' or request.endpoint == 'sales.view_order' }}">Ordenes
        de
        Mesas</a>
    <a href="{{ url_for('sales.bar_orders') }}"
        class="{{ 'active' if request.endpoint == 'sales.bar_orders' or request.endpoint == 'sales.view_bar_order' }}">Ordenes
        de
        Barra</a>
    <a href="{{ url_for('sales.sales_reports') }}"
        class="{{ 'active' if request.endpoint == 'sales.sales_reports' }}">Reportes</a>
    <a href="{{ url_for('sales.daily_closure') }}"
        class="{{ 'active' if request.endpoint == 'sales.daily_closure' }}">Cierre de
        Caja</a>
    <a href="{{ url_for('sales.manage_exchange_rate') }}"
        class="{{ 'active' if request.endpoint == 'sales.manage_exchange_rate' }}">Tasa BCV</a>
</div>
<h2>Administrar Tasa de Cambio</h2>
<p>Tasa actual: 1 USD = {{ current_rate }} Bs</p>

<form method="POST">
    <div class="form-group">
        <label for="rate">Nueva tasa (Bs por USD)</label>
        <input type="number" step="0.01" class="form-control" id="rate" name="rate" required>
    </div>
    <button type="submit" class="btn btn-primary">Actualizar Tasa</button>
</form>
{% endblock %}
