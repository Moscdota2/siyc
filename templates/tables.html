<h1>Mesas</h1>
<ul>
    {% for table in tables %}
        <li>
            Mesa {{ table.number }} - Estado: {{ table.status }}
            {% if table.status == "disponible" %}
                <a href="{{ url_for('create_order', table_id=table.id) }}">Crear Pedido</a>
            {% else %}
                <a href="{{ url_for('view_order', order_id=table.orders[0].id) }}">Ver Pedido</a>
            {% endif %}
        </li>
    {% endfor %}
</ul>
