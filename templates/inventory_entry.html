{% extends 'base.html' %}

{% block title %}Entrada de Inventario{% endblock %}

{% block content %}
<h2>Registrar Entrada de Inventario</h2>

<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4>Cervezas (36 unidades/caja)</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="product_type" value="cerveza">
                    <div class="form-group">
                        <label>Seleccione Cerveza:</label>
                        <select name="product_id" class="form-control" required>
                            {% for product in products if product.category == 'Cerveza' %}
                            <option value="{{ product.id }}">
                                {{ product.brand }} {{ product.name }} - {{ product.presentation }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Cantidad de Cajas:</label>
                        <input type="number" name="boxes" class="form-control" step="0.5" min="0.5" required>
                        <small class="text-muted">1 caja = 36 unidades | 0.5 = media caja (18 unidades)</small>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Registrar Entrada
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4>Rones (6 unidades/caja)</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="product_type" value="ron">
                    <div class="form-group">
                        <label>Seleccione Ron:</label>
                        <select name="product_id" class="form-control" required>
                            {% for product in products if product.category == 'Ron' %}
                            <option value="{{ product.id }}">
                                {{ product.brand }} {{ product.name }} - {{ product.presentation }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Cantidad de Cajas:</label>
                        <input type="number" name="boxes" class="form-control" step="1" min="1" required>
                        <small class="text-muted">1 caja = 6 unidades</small>
                    </div>
                    
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save"></i> Registrar Entrada
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
