{% extends 'base.html' %}

{% block title %}Agregar Producto{% endblock %}

{% block content %}
{% include 'inventory/_nav.html' %}
<h1>Agregar Producto</h1>
<form method="POST">
    <div class="form-group">
        <label for="name">Nombre:</label>
        <input type="text" name="name" class="form-control" required>
    </div>
    <div class="form-group">
        <label for="brand">Marca:</label>
        <input type="text" name="brand" class="form-control" required>
    </div>
    <div class="form-group">
        <label for="category">Categoría:</label>
        <select name="category" class="form-control" required>
            <option value="" disabled selected>Selecciona una categoría</option>
            <option value="Cerveza">Cerveza</option>
            <option value="Ron">Ron</option>
            <option value="Anís">Anís</option>
            <option value="Whisky">Whisky</option>
            <option value="Misceláneo">Misceláneo</option>
        </select>
    </div>
    <div class="form-group">
        <label for="presentation">Presentación:</label>
        <input type="text" name="presentation" class="form-control" required>
    </div>
    <div class="form-group">
        <label for="quantity">Cantidad Inicial:</label>
        <input type="number" name="quantity" class="form-control" min="0" required>
    </div>
    <div class="form-group">
        <label for="price_usd">Precio de Venta (USD):</label>
        <input type="number" step="0.01" name="price_usd" class="form-control" min="0" required>
    </div>
    <div class="form-group">
        <label for="purchase_price">Precio de Compra (USD Total):</label>
        <input type="number" step="0.01" name="purchase_price" class="form-control" min="0" required>
        <small class="form-text text-muted">¿Cuánto pagaste en total por la cantidad inicial?</small>
    </div>

    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{{ url_for('sales.index') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
