{% extends 'base.html' %}

{% block title %}Entrada de Inventario{% endblock %}

{% block head %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
{% endblock %}

{% block content %}
<div class="inventory-container">
    <h1 class="inventory-title"><i class="fas fa-warehouse"></i> Registro de Inventario</h1>
    
    <div class="inventory-grid">
        <!-- Tarjeta Cervezas -->
        <div class="inventory-card beer-card">
            <div class="card-header">
                <i class="fas fa-beer"></i>
                <h2>Cervezas</h2>
                <span class="badge">36 und/caja</span>
            </div>
            
            <form method="POST" class="inventory-form">
                <input type="hidden" name="product_type" value="cerveza">
                
                <div class="form-group animated-input">
                    <select name="product_id" class="form-control" required>
                        <option value="" disabled selected></option>
                        {% for product in products %}
                        <option value="{{ product.id }}">{{ product.brand }} {{ product.name }}</option>
                        {% endfor %}
                    </select>
                    <label class="input-label">Producto</label>
                </div>
                
                <div class="form-row">
                    <div class="form-group animated-input">
                        <input type="number" name="boxes" step="0.5" min="0.5" class="form-control" required>
                        <label class="input-label">Cantidad (cajas)</label>
                        <span class="input-hint">0.5 = 18 unidades</span>
                    </div>
                    
                    <div class="form-group">
                        <div class="currency-toggle">
                            <button type="button" class="currency-btn active" data-currency="usd">USD</button>
                            <button type="button" class="currency-btn" data-currency="bs">BS</button>
                            <input type="hidden" name="currency" value="usd">
                        </div>
                    </div>
                </div>
                
                <div class="form-group animated-input">
                    <input type="number" name="purchase_price" step="0.01" min="0" class="form-control" required>
                    <label class="input-label">Precio total</label>
                    <span class="currency-symbol">$</span>
                </div>
                
                <div class="form-group distributor-group">
                    <label>Distribuidor:</label>
                    <div class="distributor-buttons">
                        <label class="distributor-btn">
                            <input type="radio" name="distributor" value="polar" checked>
                            <span class="btn-content">
                                <img src="{{ url_for('static', filename='images/polar.png') }}" alt="Polar" class="distributor-icon">
                                Polar
                            </span>
                        </label>
                        <label class="distributor-btn">
                            <input type="radio" name="distributor" value="regional">
                            <span class="btn-content">
                                <img src="{{ url_for('static', filename='images/regional.png') }}" alt="Regional" class="distributor-icon">
                                Regional
                            </span>
                        </label>
                    </div>
                </div>
                
                <button type="submit" class="submit-btn beer-btn">
                    <i class="fas fa-save"></i> Registrar Cervezas
                </button>
            </form>
        </div>
        
        <!-- Tarjeta Rones -->
        <div class="inventory-card rum-card">
            <div class="card-header">
                <i class="fas fa-glass-whiskey"></i>
                <h2>Rones</h2>
                <span class="badge">6 und/caja</span>
            </div>
            
            <form method="POST" class="inventory-form">
                <input type="hidden" name="product_type" value="ron">
                
                <div class="form-group animated-input">
                    <select name="product_id" class="form-control" required>
                        <option value="" disabled selected>Selecciona un ron</option>
                        {% for product in products if product.category == 'Ron' %}
                        <option value="{{ product.id }}">{{ product.brand }} {{ product.name }}</option>
                        {% endfor %}
                    </select>
                    <label class="input-label">Producto</label>
                </div>
                
                <div class="form-row">
                    <div class="form-group animated-input">
                        <input type="number" name="boxes" step="1" min="1" class="form-control" required>
                        <label class="input-label">Cantidad (cajas)</label>
                    </div>
                    
                    <div class="form-group">
                        <div class="currency-toggle">
                            <button type="button" class="currency-btn active" data-currency="usd">USD</button>
                            <button type="button" class="currency-btn" data-currency="bs">BS</button>
                            <input type="hidden" name="currency" value="usd">
                        </div>
                    </div>
                </div>
                
                <div class="form-group animated-input">
                    <input type="number" name="purchase_price" step="0.01" min="0" class="form-control" required>
                    <label class="input-label">Precio total</label>
                    <span class="currency-symbol">$</span>
                </div>
                
                <div class="form-group distributor-group">
                    <label>Distribuidor:</label>
                    <div class="distributor-buttons">
                        <label class="distributor-btn">
                            <input type="radio" name="distributor" value="polar" checked>
                            <span class="btn-content">
                                <i class="fas fa-industry"></i>
                                Polar
                            </span>
                        </label>
                        <label class="distributor-btn">
                            <input type="radio" name="distributor" value="regional">
                            <span class="btn-content">
                                <i class="fas fa-truck"></i>
                                Regional
                            </span>
                        </label>
                    </div>
                </div>
                
                <button type="submit" class="submit-btn rum-btn">
                    <i class="fas fa-save"></i> Registrar Rones
                </button>
            </form>
        </div>
    </div>
</div>

<script>
// Efectos para los inputs animados
document.querySelectorAll('.animated-input input, .animated-input select').forEach(input => {
    input.addEventListener('focus', function() {
        this.parentNode.classList.add('focused');
    });
    
    input.addEventListener('blur', function() {
        if (this.value === '') {
            this.parentNode.classList.remove('focused');
        }
    });
    
    // Inicializar estado si ya tiene valor
    if (input.value !== '') {
        input.parentNode.classList.add('focused');
    }
});

// Cambiar moneda
document.querySelectorAll('.currency-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        const toggleGroup = this.closest('.currency-toggle');
        toggleGroup.querySelectorAll('.currency-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        toggleGroup.querySelector('input[type="hidden"]').value = this.dataset.currency;
        
        // Cambiar símbolo de moneda
        const symbol = this.dataset.currency === 'usd' ? '$' : 'Bs';
        this.closest('.inventory-form').querySelectorAll('.currency-symbol').forEach(el => {
            el.textContent = symbol;
        });
    });
});
</script>
{% endblock %}
