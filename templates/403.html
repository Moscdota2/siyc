{% extends 'base.html' %}

{% block title %}Acceso Prohibido{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-card">
        <div class="error-icon">
            <i class="fas fa-lock"></i>
        </div>
        <h1>Acceso Denegado</h1>
        <p>No tienes los permisos necesarios para acceder a esta sección.</p>
        <p class="error-code">Error 403: Forbidden</p>

        <div class="error-actions">
            <a href="{{ url_for('sales.index') }}" class="btn btn-primary">
                <i class="fas fa-home"></i> Volver al Inicio
            </a>
            <a href="javascript:history.back()" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Regresar
            </a>
        </div>
    </div>
</div>

<style>
    .error-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 60vh;
        padding: 20px;
    }

    .error-card {
        background: white;
        padding: 50px;
        border-radius: 24px;
        text-align: center;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        max-width: 500px;
        width: 100%;
    }

    .error-icon {
        width: 80px;
        height: 80px;
        background: #fee2e2;
        color: #dc2626;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
        font-size: 32px;
    }

    .error-card h1 {
        margin: 0 0 16px;
        font-size: 28px;
        color: #1e293b;
        font-weight: 800;
    }

    .error-card p {
        color: #64748b;
        margin-bottom: 8px;
        line-height: 1.6;
    }

    .error-code {
        font-family: monospace;
        background: #f1f5f9;
        padding: 4px 12px;
        border-radius: 6px;
        display: inline-block;
        margin-top: 16px;
        font-size: 14px;
    }

    .error-actions {
        display: flex;
        gap: 16px;
        justify-content: center;
        margin-top: 32px;
    }

    .btn {
        padding: 12px 24px;
        border-radius: 12px;
        font-weight: 600;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s;
    }

    .btn-primary {
        background: #3498db;
        color: white;
    }

    .btn-primary:hover {
        background: #2980b9;
        transform: translateY(-2px);
    }

    .btn-secondary {
        background: #f1f5f9;
        color: #475569;
    }

    .btn-secondary:hover {
        background: #e2e8f0;
    }
</style>
{% endblock %}
