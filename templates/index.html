{% extends 'base.html' %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="dashboard">
    <h1>Dashboard</h1>
    
    <div class="stats-container">
        <div class="stat-card">
            <h3>Stock Bajo</h3>
            <p>{{ low_stock_count }}</p>
        </div>
        <div class="stat-card">
            <h3>Mesas Ocupadas</h3>
            <p>{{ occupied_tables }}/{{ total_tables }}</p>
        </div>
        <div class="stat-card">
            <h3>Ventas Hoy</h3>
            <p>${{ "%.2f"|format(daily_sales) }}</p>
        </div>
    </div>

    <div class="charts">
        <div class="chart-container">
            <canvas id="salesChart"></canvas>
        </div>
        <div class="chart-container">
            <canvas id="stockChart"></canvas>
        </div>
    </div>
</div>

<script>
// Gráfico de ventas
const salesCtx = document.getElementById('salesChart').getContext('2d');
const salesChart = new Chart(salesCtx, {
    type: 'bar',
    data: {
        labels: ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'],
        datasets: [{
            label: 'Ventas semanales',
            data: [120, 190, 150, 200, 180, 250, 300],
            backgroundColor: 'rgba(54, 162, 235, 0.5)',
            borderColor: 'rgba(54, 162, 235, 1)',
            borderWidth: 1
        }]
    },
    options: {
        responsive: true,
        scales: {
            y: {
                beginAtZero: true
            }
        }
    }
});

// Gráfico de stock
const stockCtx = document.getElementById('stockChart').getContext('2d');
const stockChart = new Chart(stockCtx, {
    type: 'pie',
    data: {
        labels: ['Cervezas', 'Rones', 'Otros'],
        datasets: [{
            data: [65, 25, 10],
            backgroundColor: [
                'rgba(255, 99, 132, 0.5)',
                'rgba(54, 162, 235, 0.5)',
                'rgba(255, 206, 86, 0.5)'
            ],
            borderColor: [
                'rgba(255, 99, 132, 1)',
                'rgba(54, 162, 235, 1)',
                'rgba(255, 206, 86, 1)'
            ],
            borderWidth: 1
        }]
    },
    options: {
        responsive: true
    }
});
</script>
{% endblock %}
