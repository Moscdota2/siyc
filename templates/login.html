<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar System - Iniciar Sesión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="login-body">
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-glass-cheers"></i>
            <h1>Bar System</h1>
            <p>Panel de Gestión de Inventario y Ventas</p>
        </div>

        <form method="POST">
            <div class="form-group">
                <input type="text" name="username" class="form-input" placeholder="Nombre de usuario" required
                    autocomplete="username">
                <i class="fas fa-user"></i>
            </div>
            <div class="form-group">
                <input type="password" name="password" class="form-input" placeholder="Contraseña" required
                    autocomplete="current-password">
                <i class="fas fa-lock"></i>
            </div>
            <button type="submit" class="btn-login">Ingresar al Sistema</button>
        </form>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="error-messages">
            <ul>
                {% for message in messages %}
                <li><i class="fas fa-exclamation-circle"></i> {{ message }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}
        {% endwith %}
    </div>
</body>

</html>
