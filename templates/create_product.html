{% extends 'base.html' %}

{% block title %}Agregar Producto{% endblock %}

{% block content %}
<h1>Agregar Producto</h1>
<form method="POST">
    <div class="form-group">
        <label for="name">Nombre:</label>
        <input type="text" name="name" class="form-control" required>
    </div>
    <div class="form-group">
        <label for="brand">Marca:</label>
        <input type="text" name="brand" class="form-control" required>
    </div>
    <div class="form-group">
        <label for="category">Categoría:</label>
        <input type="text" name="category" class="form-control" required>
    </div>
    <div class="form-group">
        <label for="presentation">Presentación:</label>
        <input type="text" name="presentation" class="form-control" required>
    </div>
    <div class="form-group">
        <label for="quantity">Cantidad Inicial:</label>
        <input type="number" name="quantity" class="form-control" min="0" required>
    </div>
    <div class="form-group">
        <label for="price_usd">Precio USD:</label>
        <input type="number" step="0.01" name="price_usd" class="form-control" min="0" required>
    </div>
    
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
